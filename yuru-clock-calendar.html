<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YURU CLOCK &amp; CALENDAR</title>
  <style>
    :root {
      --paper: #f8f2e8;
      --paper-deep: #f2e9db;
      --ink: #51443d;
      --muted: #9a8b7f;
      --line: #d9cbbb;
      --accent: #c98c83;
      --accent-soft: #f0d7cf;
      --white: #fffaf3;
      --shadow: 0 14px 30px rgba(100, 75, 55, 0.09);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 250px;
      background: transparent;
    }

    body {
      padding: 12px;
      color: var(--ink);
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .widget {
      position: relative;
      width: min(100%, 280px);
      margin: 0;
      overflow: hidden;
      border: 1px solid rgba(137, 111, 91, 0.16);
      border-radius: 24px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .widget::before,
    .widget::after {
      content: "";
      position: absolute;
      z-index: 0;
      border-radius: 999px;
      pointer-events: none;
      opacity: 0.34;
    }

    .widget::before {
      top: -58px;
      right: -56px;
      width: 138px;
      height: 138px;
      background: var(--accent-soft);
    }

    .widget::after {
      bottom: 88px;
      left: -72px;
      width: 130px;
      height: 130px;
      border: 1px solid var(--accent-soft);
      background: transparent;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 21px 18px 16px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .eyebrow span:last-child {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0;
    }

    .clock {
      margin-top: 5px;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 17vw, 58px);
      font-weight: 400;
      letter-spacing: 0.025em;
      line-height: 1.08;
      white-space: nowrap;
    }

    .date-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 3px;
      font-size: 13px;
      letter-spacing: 0.06em;
    }

    .date-line .weekday { color: var(--accent); font-weight: 700; }
    .date-line .slash { color: var(--line); }
    .date-line .jp-date { color: var(--muted); }

    .greeting {
      margin: 14px 0 0;
      color: var(--ink);
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .dotted {
      height: 1px;
      margin: 17px 0 14px;
      background-image: linear-gradient(to right, var(--line) 35%, transparent 35%);
      background-position: top;
      background-size: 5px 1px;
      background-repeat: repeat-x;
    }

    .calendar-header,
    .calendar-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .calendar-title {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .season-mark {
      display: grid;
      width: 23px;
      height: 23px;
      place-items: center;
      border-radius: 50%;
      background: var(--accent-soft);
      font-size: 13px;
    }

    .month-label {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      letter-spacing: 0.02em;
    }

    .month-label small {
      margin-left: 3px;
      color: var(--muted);
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .nav-buttons { display: flex; gap: 2px; }

    .nav-button {
      display: grid;
      width: 25px;
      height: 25px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      transition: color 160ms ease, background 160ms ease;
    }

    .nav-button:hover,
    .nav-button:focus-visible {
      outline: none;
      color: var(--accent);
      background: var(--accent-soft);
    }

    .calendar {
      width: 100%;
      margin-top: 12px;
      border-collapse: separate;
      border-spacing: 0 3px;
      table-layout: fixed;
      font-size: 11px;
    }

    .calendar th {
      padding-bottom: 4px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
    }

    .calendar th:first-child,
    .calendar th:last-child { color: var(--accent); }

    .calendar td {
      height: 28px;
      padding: 0;
      text-align: center;
      vertical-align: middle;
    }

    .day {
      display: grid;
      width: 26px;
      height: 26px;
      margin: auto;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 50%;
      color: var(--ink);
      font-weight: 500;
      transition: background 160ms ease;
    }

    .day:not(.empty):hover { background: var(--accent-soft); }
    .day.empty { pointer-events: none; }

    .day.today {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .day.sunday,
    .day.saturday { color: #ad8178; }
    .day.today.sunday,
    .day.today.saturday { color: var(--accent); }

    .calendar-note {
      min-height: 16px;
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.03em;
      text-align: center;
    }

    .weather-divider {
      height: 1px;
      margin: 16px 0 14px;
      background-image: linear-gradient(to right, var(--line) 35%, transparent 35%);
      background-position: top;
      background-size: 5px 1px;
      background-repeat: repeat-x;
    }

    .weather-card {
      padding: 12px 12px 11px;
      border: 1px solid rgba(137, 111, 91, 0.12);
      border-radius: 16px;
      background: rgba(255, 250, 243, 0.5);
    }

    .weather-heading,
    .weather-main,
    .weather-range,
    .weather-source {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .weather-kicker {
      color: var(--muted);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.15em;
    }

    .weather-location {
      margin-top: 2px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .weather-icon {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 50%;
      background: var(--accent-soft);
      font-size: 19px;
    }

    .weather-main {
      align-items: end;
      margin-top: 9px;
    }

    .weather-temp {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 26px;
      line-height: 1;
    }

    .weather-summary {
      display: inline-block;
      margin-left: 5px;
      color: var(--muted);
      font-size: 10px;
    }

    .weather-range {
      align-items: baseline;
      gap: 7px;
      color: var(--muted);
      font-size: 9px;
    }

    .hourly {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
      margin-top: 12px;
      padding-top: 9px;
      border-top: 1px dashed var(--line);
    }

    .hour {
      min-width: 0;
      color: var(--muted);
      font-size: 8px;
      text-align: center;
    }

    .hour-time { letter-spacing: 0.03em; }

    .hour-icon {
      display: block;
      margin: 5px 0 3px;
      font-size: 14px;
      line-height: 1;
    }

    .hour-rain {
      color: var(--accent);
      font-size: 8px;
    }

    .rain-message {
      min-height: 14px;
      margin: 10px 0 0;
      color: var(--ink);
      font-size: 10px;
      letter-spacing: 0.02em;
      text-align: center;
    }

    .weather-source {
      justify-content: flex-end;
      margin-top: 7px;
      font-size: 8px;
    }

    .weather-source a {
      color: var(--muted);
      text-decoration: none;
    }

    .weather-source a:hover,
    .weather-source a:focus-visible {
      color: var(--accent);
      text-decoration: underline;
    }

    .weather-error { color: var(--muted); }

    .quick-access {
      margin-top: 16px;
    }

    .quick-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .quick-kicker {
      color: var(--muted);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.15em;
    }

    .quick-hint {
      color: var(--muted);
      font-size: 8px;
    }

    .quick-links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-top: 9px;
    }

    .quick-link {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 5px;
      min-height: 31px;
      padding: 6px 7px;
      overflow: hidden;
      border: 1px solid rgba(137, 111, 91, 0.15);
      border-radius: 10px;
      color: var(--ink);
      background: rgba(255, 250, 243, 0.42);
      font-size: 10px;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .quick-link:hover,
    .quick-link:focus-visible {
      outline: none;
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    .quick-icon {
      flex: 0 0 auto;
      font-size: 13px;
      line-height: 1;
    }

    .quick-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 11px;
      padding-top: 11px;
      border-top: 1px dashed var(--line);
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    .bread-mark {
      width: 25px;
      height: 17px;
      border: 1.5px solid var(--accent);
      border-radius: 50% 50% 42% 42%;
      opacity: 0.76;
      transform: rotate(-3deg);
    }

    .bread-mark::before,
    .bread-mark::after {
      content: "";
      display: block;
      width: 7px;
      height: 1px;
      margin-top: 5px;
      margin-left: 5px;
      background: var(--accent);
      transform: rotate(-21deg);
    }

    .bread-mark::after {
      margin-top: -1px;
      margin-left: 13px;
      transform: rotate(21deg);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="widget" aria-label="YURU CLOCK & CALENDAR">
    <div class="content">
      <div class="eyebrow">
        <span>YURU CLOCK &amp; CALENDAR</span>
        <span id="seasonIcon" aria-hidden="true">🌰</span>
      </div>

      <div class="clock" id="clock" aria-live="polite">00:00</div>

      <div class="date-line">
        <span class="weekday" id="weekday">月曜日</span>
        <span class="slash">/</span>
        <span class="jp-date" id="jpDate">2026年9月5日</span>
      </div>

      <p class="greeting" id="greeting">今日もゆるっと 🌷</p>

      <div class="dotted"></div>

      <section aria-label="月間カレンダー">
        <div class="calendar-header">
          <div class="calendar-title">
            <span class="season-mark" id="seasonMark" aria-hidden="true">🌰</span>
            <div class="month-label" id="monthLabel">September<small>2026</small></div>
          </div>
          <div class="nav-buttons" aria-label="月を移動">
            <button class="nav-button" id="prevMonth" type="button" aria-label="前の月">‹</button>
            <button class="nav-button" id="nextMonth" type="button" aria-label="次の月">›</button>
          </div>
        </div>

        <table class="calendar">
          <thead>
            <tr>
              <th scope="col">月</th>
              <th scope="col">火</th>
              <th scope="col">水</th>
              <th scope="col">木</th>
              <th scope="col">金</th>
              <th scope="col">土</th>
              <th scope="col">日</th>
            </tr>
          </thead>
          <tbody id="calendarBody"></tbody>
        </table>
        <p class="calendar-note" id="calendarNote">実りの季節を、ひとやすみ。</p>
      </section>

      <div class="weather-divider"></div>

      <section class="weather-card" aria-label="今日の天気" aria-live="polite">
        <div class="weather-heading">
          <div>
            <div class="weather-kicker">YURU WEATHER</div>
            <div class="weather-location" id="weatherLocation">東京</div>
          </div>
          <span class="weather-icon" id="weatherIcon" aria-hidden="true">☀️</span>
        </div>
        <div class="weather-main">
          <div>
            <span class="weather-temp" id="weatherTemp">--°</span>
            <span class="weather-summary" id="weatherSummary">読み込み中…</span>
          </div>
          <div class="weather-range">
            <span id="weatherHigh">最高 --°</span>
            <span id="weatherLow">最低 --°</span>
          </div>
        </div>
        <div class="hourly" id="hourlyForecast" aria-label="これからの時間別予報"></div>
        <p class="rain-message" id="rainMessage">雨の時間帯を確認中…</p>
        <div class="weather-source">
          <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">weather data: Open-Meteo</a>
        </div>
      </section>

      <section class="quick-access" aria-label="クイックアクセス">
        <div class="quick-title">
          <span class="quick-kicker">QUICK ACCESS</span>
          <span class="quick-hint">いつもの場所へ</span>
        </div>
        <nav class="quick-links" aria-label="Notionページへのショートカット">
          <a class="quick-link" href="#" data-notion-key="diary"><span class="quick-icon" aria-hidden="true">📖</span><span class="quick-label">日記</span></a>
          <a class="quick-link" href="#" data-notion-key="gallery"><span class="quick-icon" aria-hidden="true">📷</span><span class="quick-label">ギャラリー</span></a>
          <a class="quick-link" href="#" data-notion-key="bread"><span class="quick-icon" aria-hidden="true">🍞</span><span class="quick-label">パン</span></a>
          <a class="quick-link" href="#" data-notion-key="fermentation"><span class="quick-icon" aria-hidden="true">🫙</span><span class="quick-label">発酵</span></a>
          <a class="quick-link" href="#" data-notion-key="sweets"><span class="quick-icon" aria-hidden="true">🍰</span><span class="quick-label">お菓子</span></a>
          <a class="quick-link" href="#" data-notion-key="handmade"><span class="quick-icon" aria-hidden="true">🍯</span><span class="quick-label">手仕事</span></a>
          <a class="quick-link" href="#" data-notion-key="color"><span class="quick-icon" aria-hidden="true">🎨</span><span class="quick-label">色</span></a>
          <a class="quick-link" href="#" data-notion-key="favorites"><span class="quick-icon" aria-hidden="true">⭐</span><span class="quick-label">お気に入り</span></a>
        </nav>
      </section>

      <div class="footer">
        <span>small moments, softly</span>
        <span class="bread-mark" aria-label="小さな丸パンのマーク"></span>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const weekdays = ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"];
      const monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
      ];
      const monthData = [
        { icon: "❄", accent: "#8aa5b4", soft: "#dce8ea", note: "白い息と、あたたかな朝。" },
        { icon: "🕯", accent: "#b18f7a", soft: "#eaded3", note: "小さな灯りを、そっと。" },
        { icon: "🌱", accent: "#8da889", soft: "#dce8d8", note: "芽吹きの気配を、ひとつ。" },
        { icon: "🌷", accent: "#c28e9b", soft: "#eedbe1", note: "風にほどける、春の色。" },
        { icon: "🍃", accent: "#7fa68b", soft: "#dce9df", note: "新緑のそばで、深呼吸。" },
        { icon: "☂", accent: "#8e9fb9", soft: "#dfe4ee", note: "雨音も、ゆるやかなBGM。" },
        { icon: "🍋", accent: "#ba9c55", soft: "#eee7c9", note: "光をひとさじ、夏の窓辺。" },
        { icon: "🌻", accent: "#c69157", soft: "#f1dfc7", note: "夏の余韻を、ゆっくり。" },
        { icon: "🌰", accent: "#b47d67", soft: "#edd9cf", note: "実りの季節を、ひとやすみ。" },
        { icon: "🍂", accent: "#b8795f", soft: "#efd8ca", note: "落ち葉の音に、耳をすます。" },
        { icon: "🍎", accent: "#b86e68", soft: "#efd4d0", note: "りんご色の午後、ほっと一息。" },
        { icon: "🔥", accent: "#b47c68", soft: "#eed8ce", note: "薪ストーブのそばで、冬支度。" }
      ];

      const clock = document.getElementById("clock");
      const weekday = document.getElementById("weekday");
      const jpDate = document.getElementById("jpDate");
      const greeting = document.getElementById("greeting");
      const monthLabel = document.getElementById("monthLabel");
      const seasonIcon = document.getElementById("seasonIcon");
      const seasonMark = document.getElementById("seasonMark");
      const calendarBody = document.getElementById("calendarBody");
      const calendarNote = document.getElementById("calendarNote");
      const root = document.documentElement;

      // Change this one object later to move the weather card to another place.
      const WEATHER_LOCATION = {
        name: "春日部市",
        latitude: 35.975305,
        longitude: 139.752409,
        timezone: "Asia/Tokyo"
      };

      // Notion page URLs can be added here later; blank entries stay inactive.
      const QUICK_ACCESS_URLS = {
        diary: "",
        gallery: "",
        bread: "",
        fermentation: "",
        sweets: "",
        handmade: "",
        color: "",
        favorites: ""
      };

      const weatherLocation = document.getElementById("weatherLocation");
      const weatherIcon = document.getElementById("weatherIcon");
      const weatherTemp = document.getElementById("weatherTemp");
      const weatherSummary = document.getElementById("weatherSummary");
      const weatherHigh = document.getElementById("weatherHigh");
      const weatherLow = document.getElementById("weatherLow");
      const hourlyForecast = document.getElementById("hourlyForecast");
      const rainMessage = document.getElementById("rainMessage");

      const now = new Date();
      let viewedYear = now.getFullYear();
      let viewedMonth = now.getMonth();

      function pad(value) { return String(value).padStart(2, "0"); }

      function updateClock() {
        const current = new Date();
        const hour = current.getHours();
        let text = "";
        if (hour >= 5 && hour < 11) text = "おはようございます ☕";
        else if (hour >= 11 && hour < 17) text = "今日もゆるっと 🌷";
        else if (hour >= 17 && hour < 21) text = "おかえりなさい 🏠";
        else text = "今日もおつかれさまでした 🌙";

        clock.textContent = `${pad(current.getHours())}:${pad(current.getMinutes())}`;
        weekday.textContent = weekdays[current.getDay()];
        jpDate.textContent = `${current.getFullYear()}年${current.getMonth() + 1}月${current.getDate()}日`;
        greeting.textContent = text;

        if (viewedYear === current.getFullYear() && viewedMonth === current.getMonth()) renderCalendar();
      }

      function renderCalendar() {
        const data = monthData[viewedMonth];
        root.style.setProperty("--accent", data.accent);
        root.style.setProperty("--accent-soft", data.soft);
        seasonIcon.textContent = data.icon;
        seasonMark.textContent = data.icon;
        monthLabel.innerHTML = `${monthNames[viewedMonth]}<small>${viewedYear}</small>`;
        calendarNote.textContent = data.note;

        const firstDay = new Date(viewedYear, viewedMonth, 1).getDay();
        const offset = (firstDay + 6) % 7; // Monday start
        const daysInMonth = new Date(viewedYear, viewedMonth + 1, 0).getDate();
        const isCurrentMonth = viewedYear === now.getFullYear() && viewedMonth === now.getMonth();
        const today = now.getDate();
        let html = "";
        let dayNumber = 1;

        for (let row = 0; row < 6; row += 1) {
          html += "<tr>";
          for (let column = 0; column < 7; column += 1) {
            const cellIndex = row * 7 + column;
            if (cellIndex < offset || dayNumber > daysInMonth) {
              html += '<td><span class="day empty" aria-hidden="true"></span></td>';
              continue;
            }
            const currentDay = dayNumber;
            const isToday = isCurrentMonth && currentDay === today;
            const weekend = column === 5 ? "saturday" : column === 6 ? "sunday" : "";
            const classes = ["day", weekend, isToday ? "today" : ""].filter(Boolean).join(" ");
            html += `<td><span class="${classes}"${isToday ? ' aria-current="date"' : ""}>${currentDay}</span></td>`;
            dayNumber += 1;
          }
          html += "</tr>";
          if (dayNumber > daysInMonth) break;
        }
        calendarBody.innerHTML = html;
      }

      function moveMonth(amount) {
        const next = new Date(viewedYear, viewedMonth + amount, 1);
        viewedYear = next.getFullYear();
        viewedMonth = next.getMonth();
        renderCalendar();
      }

      document.getElementById("prevMonth").addEventListener("click", () => moveMonth(-1));
      document.getElementById("nextMonth").addEventListener("click", () => moveMonth(1));

      document.querySelectorAll(".quick-link").forEach((link) => {
        const url = QUICK_ACCESS_URLS[link.dataset.notionKey];
        if (url) {
          link.href = url;
          link.target = "_blank";
          link.rel = "noreferrer";
        } else {
          link.addEventListener("click", (event) => event.preventDefault());
        }
      });

      const weatherCodes = {
        0: ["☀️", "晴れ"],
        1: ["🌤️", "おおむね晴れ"],
        2: ["⛅", "晴れ時々くもり"],
        3: ["☁️", "くもり"],
        45: ["🌫️", "霧"],
        48: ["🌫️", "霧"],
        51: ["🌦️", "弱い霧雨"],
        53: ["🌦️", "霧雨"],
        55: ["🌧️", "霧雨"],
        56: ["🌧️", "凍る霧雨"],
        57: ["🌧️", "凍る霧雨"],
        61: ["🌧️", "弱い雨"],
        63: ["🌧️", "雨"],
        65: ["🌧️", "強い雨"],
        66: ["🌨️", "凍る雨"],
        67: ["🌨️", "凍る雨"],
        71: ["❄️", "弱い雪"],
        73: ["❄️", "雪"],
        75: ["❄️", "強い雪"],
        77: ["🌨️", "雪あられ"],
        80: ["🌦️", "にわか雨"],
        81: ["🌦️", "にわか雨"],
        82: ["🌧️", "強いにわか雨"],
        85: ["🌨️", "にわか雪"],
        86: ["🌨️", "にわか雪"],
        95: ["⛈️", "雷雨"],
        96: ["⛈️", "雷雨とひょう"],
        99: ["⛈️", "雷雨とひょう"]
      };

      function weatherLabel(code) {
        return weatherCodes[code] || ["🌤️", "空模様" ];
      }

      function formatHour(value) {
        return `${String(value).padStart(2, "0")}時`;
      }

      function getRainHours(times, probabilities, rainAmounts) {
        const rainHours = [];
        const todayKey = new Intl.DateTimeFormat("sv-SE", {
          timeZone: WEATHER_LOCATION.timezone,
          year: "numeric", month: "2-digit", day: "2-digit"
        }).format(new Date());

        times.forEach((time, index) => {
          const isToday = time.startsWith(todayKey);
          const probability = probabilities[index] || 0;
          const amount = rainAmounts[index] || 0;
          if (isToday && (probability >= 40 || amount >= 0.1)) {
            rainHours.push(new Date(`${time}:00`));
          }
        });
        return rainHours;
      }

      function formatRainWindow(hours) {
        if (!hours.length) return "今日は大きな雨の予報はありません。";
        const windows = [];
        let start = hours[0];
        let end = hours[0];
        for (let i = 1; i < hours.length; i += 1) {
          const difference = hours[i] - end;
          if (difference <= 60 * 60 * 1000) end = hours[i];
          else {
            windows.push([start, end]);
            start = hours[i];
            end = hours[i];
          }
        }
        windows.push([start, end]);
        const text = windows.map(([from, to]) => {
          const fromHour = from.getHours();
          const toHour = to.getHours() + 1;
          return fromHour === toHour ? formatHour(fromHour) : `${formatHour(fromHour)}〜${formatHour(toHour)}`;
        }).join("、");
        return `雨は${text}ごろの予報です。傘を忘れずに。`;
      }

      function renderWeather(data) {
        const current = data.current;
        const daily = data.daily;
        const hourly = data.hourly;
        const [icon, summary] = weatherLabel(current.weather_code);
        weatherLocation.textContent = WEATHER_LOCATION.name;
        weatherIcon.textContent = icon;
        weatherTemp.textContent = `${Math.round(current.temperature_2m)}°`;
        weatherSummary.textContent = summary;
        weatherHigh.textContent = `最高 ${Math.round(daily.temperature_2m_max[0])}°`;
        weatherLow.textContent = `最低 ${Math.round(daily.temperature_2m_min[0])}°`;

        const currentHour = new Date().getHours();
        const startHour = currentHour - (currentHour % 3);
        const hourIndexes = [];
        hourly.time.forEach((time, index) => {
          const date = new Date(`${time}:00`);
          const hour = date.getHours();
          if (index > 0 && hourIndexes.length < 5 && index >= startHour && index % 3 === startHour % 3) hourIndexes.push(index);
        });
        const fallbackIndexes = hourly.time.map((_, index) => index).filter((index) => index >= startHour).slice(0, 5);
        const indexes = hourIndexes.length >= 3 ? hourIndexes : fallbackIndexes;
        hourlyForecast.innerHTML = indexes.map((index) => {
          const date = new Date(`${hourly.time[index]}:00`);
          const [hourIcon] = weatherLabel(hourly.weather_code[index]);
          const probability = hourly.precipitation_probability[index] || 0;
          return `<div class="hour"><span class="hour-time">${formatHour(date.getHours())}</span><span class="hour-icon" aria-hidden="true">${hourIcon}</span><span class="hour-rain">${probability >= 20 ? `雨 ${probability}%` : "　"}</span></div>`;
        }).join("");

        const rainHours = getRainHours(hourly.time, hourly.precipitation_probability, hourly.rain);
        rainMessage.textContent = formatRainWindow(rainHours);
      }

      async function loadWeather() {
        const params = new URLSearchParams({
          latitude: WEATHER_LOCATION.latitude,
          longitude: WEATHER_LOCATION.longitude,
          current: "temperature_2m,weather_code",
          hourly: "temperature_2m,precipitation_probability,rain,weather_code",
          daily: "temperature_2m_max,temperature_2m_min,weather_code",
          timezone: WEATHER_LOCATION.timezone,
          forecast_days: "2"
        });
        try {
          const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`);
          if (!response.ok) throw new Error("weather request failed");
          renderWeather(await response.json());
        } catch (error) {
          weatherLocation.textContent = WEATHER_LOCATION.name;
          weatherSummary.textContent = "取得できませんでした";
          weatherTemp.textContent = "--°";
          weatherHigh.textContent = "最高 --°";
          weatherLow.textContent = "最低 --°";
          hourlyForecast.innerHTML = "<span class=\"weather-error\">予報を読み込めませんでした。</span>";
          rainMessage.textContent = "時間をおいて再読み込みしてください。";
        }
      }

      renderCalendar();
      updateClock();
      loadWeather();
      window.setInterval(updateClock, 1000);
    })();
  </script>
</body>
